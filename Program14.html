
<!DOCTYPE html>
<html>
<head>
    <title>Calendar Generator</title>
</head>
<body>
    YEAR:
    <input type="number" id="year_get" placeholder="Enter year">
    <br><br>
    MONTH (1 - 12):
    <input type="number" id="month_get" min="1" max="12" placeholder="Enter month">
    <br><br>
    <input type="button" value="Display Calendar" onclick="generate()">
    <br><br>
    <div id="content"></div>
<script>
function generate()
{
    var year = parseInt(document.getElementById("year_get").value);
    var month = parseInt(document.getElementById("month_get").value);
    // Validate input
    if (isNaN(year) || isNaN(month) || month < 1 || month > 12)
    {
        alert("Please enter a valid year and month (1-12)");
        return;
    }
    // JavaScript months start from 0
    var date = new Date(year, month - 1, 1);
    var day = date.getDay();
    var init_content = "<table border='1' cellpadding='10'>";
    init_content += "<tr>";
    init_content += "<th>Sun</th><th>Mon</th><th>Tue</th>";
    init_content += "<th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th>";
    init_content += "</tr><tr>";
    // Add empty cells before the first date
    for (var i = 0; i < day; i++)
    {
        init_content += "<td></td>";
    }
    // Generate calendar dates
    while (date.getMonth() == month - 1)
    {
        init_content += "<td>" + date.getDate() + "</td>";

        if (date.getDay() == 6)
        {
            init_content += "</tr><tr>";
        }
        date.setDate(date.getDate() + 1);
    }
    // Fill remaining empty cells
    var remaining = 6 - new Date(year, month, 0).getDay();
    for (var i = 0; i < remaining; i++)
    {
        init_content += "<td></td>";
    }
    init_content += "</tr></table>";
    document.getElementById("content").innerHTML = init_content;
}
</script>
</body>
</html>
